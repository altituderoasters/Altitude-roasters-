<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment status — Altitude Roasters</title>
<style>
  body{
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
    background:#ffffff;color:#344243;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;margin:0;padding:24px;
  }
  .card{max-width:420px;text-align:center;}
  h1{font-size:1.4rem;margin:0 0 12px;font-weight:700;}
  p{color:#4a4a48;font-size:0.95rem;line-height:1.6;margin:0;}
  .icon{font-size:44px;margin-bottom:16px;}
  a.btn{
    display:inline-block;margin-top:28px;
    background:#344243;color:#fff;
    padding:14px 30px;text-decoration:none;
    font-weight:700;text-transform:uppercase;
    letter-spacing:0.6px;font-size:14px;
  }
</style>
</head>
<body>
  <div class="card" id="statusCard">
    <div class="icon">&#8230;</div>
    <h1>Checking your payment&hellip;</h1>
    <p>Please wait a moment.</p>
  </div>

<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var paymentId = params.get('paymentId');
  var forcedError = params.get('status') === 'error';
  var card = document.getElementById('statusCard');

  function render(icon, title, msg, showHome){
    card.innerHTML =
      '<div class="icon">' + icon + '</div>' +
      '<h1>' + title + '</h1>' +
      '<p>' + msg + '</p>' +
      (showHome ? '<a class="btn" href="/">Back to menu</a>' : '');
  }

  if (forcedError || !paymentId) {
    render('&#10005;', 'Payment not completed',
      'Your payment was cancelled or did not go through. No charge was made.', true);
    return;
  }

  fetch('/api/verify-payment?paymentId=' + encodeURIComponent(paymentId))
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (data.status === 'Paid') {
        render('&#10003;', 'Payment received',
          'Thank you \u2014 your order is confirmed.' +
          (data.reference ? ' Reference: ' + data.reference : ''), true);
      } else if (data.status === 'Pending') {
        render('&#8230;', 'Payment pending',
          'We\u2019re still confirming your payment. This can take a minute \u2014 please check back shortly.', true);
      } else {
        render('&#10005;', 'Payment not completed',
          'Your payment could not be confirmed. If you were charged, please contact us.', true);
      }
    })
    .catch(function(){
      render('&#10005;', 'Could not verify payment',
        'Something went wrong checking your payment status. If you were charged, please contact us.', true);
    });
})();
</script>
</body>
</html>
