<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order status — Altitude Roasters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@36,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241E19; --ink-soft:#5B5347; --paper:#F7F4EC;
    --parchment:#EAE3D3; --copper:#A85C24; --copper-dark:#7C431A;
    --sage:#6E7A5C; --line:rgba(36,30,25,0.13);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;
  }
  .card{
    max-width:420px;width:100%;text-align:center;
    background:#fff;border:1px solid var(--line);
    border-radius:16px;padding:40px 28px;
  }
  .icon{
    width:60px;height:60px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 22px;color:#fff;font-size:1.8rem;
  }
  .icon.ok{background:var(--sage);}
  .icon.fail{background:#B3453B;}
  .icon.wait{background:var(--copper);}
  h1{
    font-family:'Big Shoulders',sans-serif;font-weight:700;
    font-size:1.7rem;margin:0 0 8px;letter-spacing:0.01em;
  }
  p{color:var(--ink-soft);font-size:0.92rem;line-height:1.5;margin:0;}
  .order-id{
    font-family:'Big Shoulders',sans-serif;font-weight:700;font-size:1.1rem;
    color:var(--copper-dark);margin:16px 0;
  }
  a.back{
    display:inline-block;margin-top:24px;
    background:var(--ink);color:var(--paper);
    padding:12px 24px;border-radius:8px;
    text-decoration:none;font-size:0.9rem;font-weight:600;
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon wait" id="statusIcon">…</div>
    <h1 id="statusTitle">Checking your payment…</h1>
    <p id="statusText">Just a moment.</p>
    <div class="order-id" id="orderIdLine" style="display:none;"></div>
    <a class="back" href="index.html">Back to menu</a>
  </div>

<script>
async function checkStatus(){
  const params = new URLSearchParams(window.location.search);
  const tapId = params.get('tap_id');

  const icon = document.getElementById('statusIcon');
  const title = document.getElementById('statusTitle');
  const text = document.getElementById('statusText');
  const orderLine = document.getElementById('orderIdLine');

  if(!tapId){
    icon.className = 'icon fail';
    icon.textContent = '!';
    title.textContent = 'Nothing to check';
    text.textContent = "We couldn't find a payment reference in this link.";
    return;
  }

  try{
    const res = await fetch('/api/verify-charge?tap_id=' + encodeURIComponent(tapId));
    const data = await res.json();

    if(!res.ok){
      throw new Error(data.error || 'verify failed');
    }

    if(data.orderId){
      orderLine.textContent = 'Order ' + data.orderId;
      orderLine.style.display = 'block';
    }

    if(data.status === 'CAPTURED'){
      icon.className = 'icon ok';
      icon.innerHTML = '&check;';
      title.textContent = 'Payment confirmed';
      text.textContent = "We've got your order — thank you!";
    } else if(data.status === 'INITIATED' || data.status === 'PENDING'){
      icon.className = 'icon wait';
      icon.textContent = '…';
      title.textContent = 'Still processing';
      text.textContent = 'Give it a moment and refresh this page.';
    } else {
      icon.className = 'icon fail';
      icon.textContent = '×';
      title.textContent = 'Payment not completed';
      text.textContent = data.message || 'The payment was not successful. Please try again from the menu.';
    }
  } catch(err){
    icon.className = 'icon fail';
    icon.textContent = '!';
    title.textContent = 'Could not check payment status';
    text.textContent = 'Please contact us if you were charged and did not get confirmation here.';
  }
}
checkStatus();
</script>
</body>
</html>
